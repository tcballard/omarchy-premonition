name: machine-independent acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install system checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq shellcheck
      - name: Select pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt && rustup override set 1.98.0
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Fetch pinned Omarchy validator
        run: |
          git clone --filter=blob:none https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout --detach 981274b20af8e85c09845071ac33c6230909f119
          test "$(sha256sum "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" | cut -d' ' -f1)" = f7507e5042eb970e3dc918bdf6bf251c7557443892a77e71a17d7019ddde72c8
      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
          cargo build --workspace --all-features --release --locked
          cargo deny check
          shellcheck scripts/*.sh
          bash -n scripts/*.sh
          python3 scripts/check-qml.py
          python3 scripts/check-secrets.py
          bash "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .
      - name: Package committed object and revalidate archive
        env:
          OMARCHY_VALIDATOR: ${{ runner.temp }}/omarchy/bin/omarchy-plugin-validate
        run: ./scripts/package.sh

  quickshell-runtime:
    name: Quickshell runtime contract
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install runtime
        run: pacman -Syu --noconfirm git jq python quickshell weston
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned Omarchy
        run: |
          git clone --filter=blob:none https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout --detach 981274b20af8e85c09845071ac33c6230909f119
      - name: Run real QML under headless Weston
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-9 --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          export WAYLAND_DISPLAY=wayland-9
          for _ in {1..50}; do [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          OMARCHY_PATH="$RUNNER_TEMP/omarchy" \
            PREMONITION_RUNTIME_SCREENSHOT="$RUNNER_TEMP/premonition-runtime.png" \
            ./scripts/check-qml-runtime.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premonition-quickshell-runtime
          path: ${{ runner.temp }}/premonition-runtime.png
          if-no-files-found: error
